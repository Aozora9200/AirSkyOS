# /etc/airskyos/branding.conf
# AirSkyOS ブランディング設定
# パッケージ更新後に pacman フック (zz-airskyos-*.hook) がこの設定に従って
# OS名・ロゴ・ブートテーマを AirSkyOS のものに戻します。
# 0 にするとその項目には触れません。

# /etc/os-release を /usr/share/airskyos/os-release の内容で固定する
OS_RELEASE=1

# /etc/lsb-release の DISTRIB_DESCRIPTION を AirSkyOS にする
LSB_RELEASE=1

# /etc/issue (TTY ログイン画面) の "Arch Linux" / "CachyOS Linux" を置き換える
ISSUE=1

# 使用する Plymouth テーマ名。空にすると Plymouth には触れません
PLYMOUTH_THEME=airsky-bootanimation

# Limine のブートメニューを AirSkyOS の名前・配色・背景に保つ
# (見た目は /etc/airskyos/limine-theme.conf で変更できます)
LIMINE_BRANDING=1

# --- KDE ---------------------------------------------------------------
# デザイン (配色・Plasma スタイル・ウィンドウ装飾・カーソル・スプラッシュ) は
# AirSkyOS の更新で新しい版が配られたときに自動で再適用されます。
# レイアウト (パネル・ウィジェット・配置) と壁紙は、各ユーザーの初回ログイン時に
# 1回だけ適用されます。その後はユーザーが自由に変更でき、自動で戻ることはありません。

# 1 = ログイン時に AirSkyOS のデザインを適用する
APPLY_KDE_DEFAULTS=1

# 新しいユーザーに適用するグローバルテーマ (ClearSky / "ClearSky Dark")
LOOKANDFEEL="ClearSky"

# 1 = 新しいユーザーの初回ログイン時に AirSkyOS のレイアウトと壁紙も適用する
APPLY_LAYOUT_ON_FIRST_LOGIN=1

# 手動で適用する場合 (一般ユーザーで実行):
#   airskyos-apply-theme            デザインだけ適用 (レイアウト・壁紙はそのまま)
#   airskyos-apply-theme --layout   レイアウトと壁紙も AirSkyOS の既定に戻す

# ※ KWin・Konsole・ロック画面・カーソルなどの既定値はシステム側
#   (/etc/xdg/*) にあります。ユーザーが自分で設定した値 (~/.config) が優先されます。
