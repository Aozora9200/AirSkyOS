# AirSkyOS Limine theme
# These global options are written into the Limine config (limine.conf on the
# EFI partition) after installs and updates, replacing the CachyOS theme.
# Edit this file to change the look; set LIMINE_BRANDING=0 in
# /etc/airskyos/branding.conf to leave limine.conf completely alone.
#
# Colors: RRGGBB, or AARRGGBB where AA=ff means fully transparent.
interface_branding: AirSkyOS
interface_branding_color: 6
term_palette: 0b1a33;e5534b;57ab5a;c69026;5dadec;b083f0;9fd3ff;e6edf3
term_palette_bright: 3b5070;ff7b72;7ee787;e3b341;8ccbff;d2a8ff;c8e6ff;ffffff
term_background: ffffffff
term_foreground: e6edf3
term_background_bright: ffffffff
term_foreground_bright: ffffff
wallpaper: boot():/airskyos-splash.jpg
wallpaper_style: stretched
