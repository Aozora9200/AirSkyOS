<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  AirSkyOS: Japanese text in Noto Sans CJK JP (gothic), not a Mincho/Sung
  (serif) font. Without this, fontconfig may pick whichever CJK font comes
  first - on CachyOS often a serif one such as AR PL New Sung.
  Explicit serif requests still get Noto Serif CJK JP.
  Installed by airskyos-kde-settings; your own ~/.config/fontconfig wins.
-->
<fontconfig>
  <!-- generic families -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family><family>Noto Sans CJK JP</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>Noto Serif CJK JP</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Noto Sans Mono</family><family>Noto Sans Mono CJK JP</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Noto Sans</family><family>Noto Sans CJK JP</family></prefer>
  </alias>

  <!-- Latin UI / terminal fonts without Japanese glyphs: fall back to gothic -->
  <match target="pattern">
    <test name="family" qual="any"><string>Noto Sans</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Inter</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Hack</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>JetBrains Mono</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Fira Sans</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>

  <!-- text tagged as Japanese that asks for a generic gothic/sans font:
       put Noto Sans CJK JP first, ahead of Chinese fonts that other font
       packages add for "ja" (WenQuanYi, AR PL, ...) -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family" qual="first"><string>sans-serif</string></test>
    <test name="family" qual="first" compare="not_eq"><string>Noto Sans CJK JP</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
</fontconfig>
